<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gift Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1 id="title">Gift Registry</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div id="user-box" class="user-box" hidden>
        <span id="greeting"></span>
        <button id="logout" class="btn-link" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="demo-banner" class="banner" hidden>
      Demo mode: no API URL set in <code>config.js</code>. Log in with <b>test</b> / <b>oak-penguin-42</b>.
    </div>

    <section id="login-view" class="card login-card" hidden>
      <h2>Welcome</h2>
      <p class="muted">Use the name and password we sent you.</p>
      <form id="login-form" autocomplete="on">
        <label>Name
          <input id="username" name="username" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" id="login-btn">Open the list</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="list-view" hidden>
      <div class="toolbar">
        <div id="categories" class="chips" role="group" aria-label="Filter by category"></div>
        <label class="toggle"><input type="checkbox" id="hide-claimed"> Hide sorted gifts</label>
      </div>
      <p id="summary" class="muted summary"></p>
      <div id="gifts" class="grid" aria-live="polite"></div>
      <p id="empty" class="muted empty" hidden>Nothing to show here.</p>
    </section>

    <div id="loading" class="loading" hidden>Loading…</div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
