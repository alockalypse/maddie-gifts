<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gifts for Madeline Jane</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=7">
  <script>
    // Apply a saved theme before first paint to avoid a flash
    try { var t = localStorage.getItem('registry.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1 id="title">Gifts for Madeline Jane</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div class="header-right">
        <div id="user-box" class="user-box" hidden>
          <span id="greeting"></span>
          <button id="logout" class="btn-link" type="button">Log out</button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">🌙</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="demo-banner" class="banner" hidden>
      Demo mode: no API URL set in <code>config.js</code>. Log in with <b>test</b> / <b>oak-penguin-42</b>.
    </div>

    <section id="login-view" class="card login-card" hidden>
      <h2>Welcome</h2>
      <p class="muted">Use the name and password we sent you.</p>
      <form id="login-form" autocomplete="on">
        <label>Name
          <input id="username" name="username" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" id="login-btn">Open the list</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="list-view" hidden>
      <div class="toolbar">
        <div class="toolbar-row">
          <div id="views" class="chips views" role="group" aria-label="Show">
            <button type="button" class="chip" data-view="all" aria-pressed="true">All</button>
            <button type="button" class="chip" data-view="needed" aria-pressed="false">Still needed</button>
            <button type="button" class="chip" data-view="mine" aria-pressed="false">Mine</button>
          </div>
          <div class="toolbar-right">
          <label class="sort-box"><span class="visually-hidden">Sort by</span>
            <select id="sort" aria-label="Sort by">
              <option value="suggested">Sort: Suggested</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </label>
          <div id="layouts" class="layout-toggle" role="group" aria-label="Layout">
            <button type="button" data-layout="list" aria-pressed="true" aria-label="List view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
            </button>
            <button type="button" data-layout="grid" aria-pressed="false" aria-label="Card view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
            </button>
          </div>
          </div>
        </div>
        <div id="budget-box" class="budget" hidden>
          <label for="budget">Budget</label>
          <input type="range" id="budget" min="0" max="100" step="1" value="100">
          <output id="budget-out" for="budget">Any</output>
        </div>
        <div id="categories" class="chips" role="group" aria-label="Filter by category"></div>
      </div>
      <p id="summary" class="muted summary"></p>
      <div id="gifts" class="grid" aria-live="polite"></div>
      <p id="empty" class="muted empty" hidden></p>
    </section>

    <div id="loading" class="loading" hidden>Loading…</div>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
